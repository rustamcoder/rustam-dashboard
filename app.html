<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>RUSTAM — Private Dashboard</title><style>:root{--bg:#0b0d12;--card:#171a21;--line:#2a2e38;--text:#f4f6fa;--muted:#8e95a3;--blue:#4f7cff;--mint:#65e6b4;--red:#ff6376}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Arial,sans-serif;overflow:hidden}.auth{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#172750 0,transparent 35%),radial-gradient(circle at 85% 85%,#17352e 0,transparent 32%),var(--bg)}.auth.hidden{display:none}.auth-card{width:min(430px,100%);background:linear-gradient(145deg,#191d25,#12151b);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 30px 80px #0008;position:relative;overflow:hidden}.auth-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#4f7cff22;filter:blur(20px);right:-60px;top:-70px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:bold;letter-spacing:.04em}.mark{width:34px;height:34px;background:linear-gradient(145deg,var(--blue),var(--mint));clip-path:polygon(0 0,100% 0,70% 35%,70% 75%,36% 100%,36% 36%,0 36%)}h1{font-size:31px;line-height:1.1;margin:35px 0 10px}p{color:var(--muted)}label{display:block;color:var(--muted);font-size:10px;margin:22px 0 8px}.field{height:48px;width:100%;background:#101319;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:0 13px;outline:0}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4f7cff1f}.submit{width:100%;height:48px;margin-top:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 10px 28px #315bd544}.error{min-height:20px;color:var(--red);font-size:10px;margin-top:12px}.privacy{display:flex;gap:8px;align-items:center;margin-top:23px;padding-top:20px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}.privacy i,.status i{width:7px;height:7px;background:var(--mint);border-radius:50%}.shell{position:fixed;inset:0;display:none;background:var(--bg)}.shell.on{display:block}.app-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}.cloudbar{position:absolute;z-index:20;right:18px;top:78px;display:flex;gap:7px;align-items:center}.badge,.cloudbar button{height:34px;border:1px solid var(--line);background:#171a21e8;backdrop-filter:blur(12px);border-radius:9px;color:var(--muted);font-size:9px;padding:0 11px}.badge{display:flex;align-items:center;gap:7px}.badge i{width:7px;height:7px;border-radius:50%;background:var(--mint)}.cloudbar button{color:var(--text);cursor:pointer}.install{display:none!important}.install.show{display:block!important}.loading{position:fixed;z-index:25;inset:0;display:grid;place-items:center;background:var(--bg)}.loading.hidden{display:none}.spinner{width:44px;height:44px;border:3px solid #29303d;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}.offline{position:fixed;z-index:40;left:50%;bottom:18px;transform:translate(-50%,100px);background:#fff;color:#111;padding:11px 16px;border-radius:9px;font-size:10px;transition:.3s}.offline.show{transform:translate(-50%,0)}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.auth-card{padding:27px}.cloudbar{top:76px;right:9px}.badge{display:none}.cloudbar button{padding:0 9px}.cloudbar button:last-child{font-size:0}.cloudbar button:last-child:after{content:"Выйти";font-size:9px}}</style></head><body><section class="auth" id="auth"><form class="auth-card" id="loginForm"><div class="brand"><span class="mark"></span>RUSTAM</div><h1>Твоё личное пространство</h1><p>Войди, чтобы синхронизировать цели, задачи и заметки между Android и ноутбуком.</p><label>EMAIL</label><input class="field" id="email" type="email" value="torixtube077@gmail.com" readonly><label>ПАРОЛЬ</label><input class="field" id="password" type="password" required autocomplete="current-password" placeholder="Введи пароль Supabase"><button class="submit" id="loginBtn">Войти в приложение</button><div class="error" id="error"></div><div class="privacy"><i></i>Доступ разрешён только владельцу. Пароль не сохраняется в коде сайта.</div></form></section><div class="loading hidden" id="loading"><div class="spinner"></div></div><section class="shell" id="shell"><iframe class="app-frame" id="frame" title="RUSTAM Dashboard"></iframe><div class="cloudbar"><span class="badge status" id="sync"><i></i><span>Синхронизировано</span></span><button class="install" id="install">Установить</button><button id="logout">Выйти из аккаунта</button></div></section><div class="offline" id="offline">Нет интернета — изменения сохранятся локально</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const cfg=window.RUSTAM_SUPABASE,client=supabase.createClient(cfg.url,cfg.publishableKey),auth=document.querySelector('#auth'),shell=document.querySelector('#shell'),frame=document.querySelector('#frame'),loading=document.querySelector('#loading'),error=document.querySelector('#error'),sync=document.querySelector('#sync');let user=null,lastData='',saveTimer=null,installPrompt=null,frameReady=false;function setSync(text,busy=false){sync.querySelector('span').textContent=text;sync.querySelector('i').style.background=busy?'#ffb65c':'#65e6b4'}async function openApp(session){user=session.user;if(user.email.toLowerCase()!==cfg.allowedEmail.toLowerCase()){await client.auth.signOut();error.textContent='Для этого аккаунта доступ закрыт.';return}auth.classList.add('hidden');loading.classList.remove('hidden');try{const {data,err}=await client.from('user_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(err)throw err;if(data?.data&&Object.keys(data.data).length){localStorage.setItem('rustam-app',JSON.stringify(data.data));lastData=JSON.stringify(data.data)}else{const local=localStorage.getItem('rustam-app');const initial=local?JSON.parse(local):{};await client.from('user_data').upsert({user_id:user.id,data:initial});lastData=JSON.stringify(initial)}frame.src='index.html';frame.onload=()=>{frameReady=true;loading.classList.add('hidden');shell.classList.add('on');setTimeout(watchLocal,500)}}catch(e){loading.classList.add('hidden');auth.classList.remove('hidden');error.textContent='Ошибка подключения: '+e.message}}async function pushCloud(raw){if(!user||!raw||!navigator.onLine)return;setSync('Сохранение…',true);try{const parsed=JSON.parse(raw);const {error:e}=await client.from('user_data').upsert({user_id:user.id,data:parsed});if(e)throw e;lastData=raw;setSync('Синхронизировано')}catch(e){setSync('Ошибка синхронизации',true)}}function watchLocal(){if(!frameReady)return;const raw=localStorage.getItem('rustam-app')||'';if(raw&&raw!==lastData){clearTimeout(saveTimer);saveTimer=setTimeout(()=>pushCloud(raw),700)}setTimeout(watchLocal,1300)}document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();error.textContent='';const btn=document.querySelector('#loginBtn');btn.disabled=true;btn.textContent='Входим…';const {data,error:err}=await client.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});btn.disabled=false;btn.textContent='Войти в приложение';if(err)error.textContent=err.message==='Invalid login credentials'?'Неверный пароль. Проверь данные аккаунта.':err.message;else openApp(data.session)};document.querySelector('#logout').onclick=async()=>{await client.auth.signOut();location.reload()};client.auth.getSession().then(({data})=>{if(data.session)openApp(data.session)});client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){shell.classList.remove('on');auth.classList.remove('hidden')}});window.addEventListener('online',()=>{document.querySelector('#offline').classList.remove('show');const raw=localStorage.getItem('rustam-app');if(raw&&raw!==lastData)pushCloud(raw)});window.addEventListener('offline',()=>document.querySelector('#offline').classList.add('show'));window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.querySelector('#install').classList.add('show')});document.querySelector('#install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.querySelector('#install').classList.remove('show')}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
