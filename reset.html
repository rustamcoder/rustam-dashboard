<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Очистка RUSTAM</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#182853,transparent 35%),#0b0d12;color:#f4f6fa;font:14px/1.5 Arial,sans-serif;padding:20px}.card{width:min(440px,100%);background:#171a21;border:1px solid #2a2e38;border-radius:20px;padding:32px;text-align:center;box-shadow:0 25px 70px #0008}.logo{width:58px;height:58px;margin:auto;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#4f7cff,#65e6b4);color:#071019;font-size:24px;font-weight:bold}h1{font-size:27px;margin:22px 0 8px}p{color:#8e95a3}.spinner{width:38px;height:38px;border:3px solid #2a2e38;border-top-color:#4f7cff;border-radius:50%;margin:24px auto;animation:s .8s linear infinite}.hidden{display:none}button,a{display:inline-grid;place-items:center;min-height:44px;padding:0 18px;border:0;border-radius:9px;background:#4f7cff;color:white;text-decoration:none;font-weight:bold;cursor:pointer}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="logo">R</div><h1 id="title">Очищаю данные</h1><p id="message">Удаляю цели, задачи, привычки, заметки и статистику с устройства и из Supabase.</p><div class="spinner" id="spinner"></div><a class="hidden" id="action" href="app.html">Вернуться ко входу</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const title=document.querySelector('#title'),message=document.querySelector('#message'),spinner=document.querySelector('#spinner'),action=document.querySelector('#action');function fail(text){title.textContent='Нужно войти';message.textContent=text;spinner.classList.add('hidden');action.classList.remove('hidden')}async function run(){try{const cfg=window.RUSTAM_SUPABASE,client=supabase.createClient(cfg.url,cfg.publishableKey),{data:{session}}=await client.auth.getSession();if(!session)return fail('Сначала открой приложение, войди в аккаунт, затем снова открой эту страницу очистки.');if(session.user.email.toLowerCase()!==cfg.allowedEmail.toLowerCase())return fail('Этот аккаунт не имеет доступа к RUSTAM.');const empty={name:'Rustam',color:'#4f7cff',goals:[],tasks:[],habits:[],notes:[],chat:[['ai','Привет, Rustam! Всё начинается с чистого листа. Добавь первую цель или спроси, с чего начать.']],focus:0,_resetVersion:'clean-owner-data-v2'};const {error}=await client.from('user_data').upsert({user_id:session.user.id,data:empty});if(error)throw error;localStorage.removeItem('rustam-dashboard-v1');localStorage.removeItem('rustam-reset-version');localStorage.setItem('rustam-app',JSON.stringify(empty));if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}title.textContent='Всё удалено';message.textContent='Приложение очищено. Сейчас откроется пустой RUSTAM Dashboard.';spinner.classList.add('hidden');setTimeout(()=>location.replace('app.html?fresh='+Date.now()),1200)}catch(e){title.textContent='Ошибка очистки';message.textContent=e.message;spinner.classList.add('hidden');action.classList.remove('hidden')}}run();</script></body></html>
